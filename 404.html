<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未找到 · 靛蓝档案</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%23141a36'/%3E%3Cpath d='M32 12a20 20 0 1 0 0 40 20 20 0 0 1 0-40z' fill='%234dd8d0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Noto Sans SC','Space Grotesk','PingFang SC','Microsoft YaHei',sans-serif;
    background:#0d1226;color:#eef1f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(238,241,249,0.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 75% 65%, rgba(238,241,249,0.35) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 45% 85%, rgba(77,216,208,0.4) 50%, transparent 51%),
      linear-gradient(rgba(238,241,249,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(238,241,249,0.045) 1px, transparent 1px);
    background-size:300px 300px,280px 280px,320px 320px,44px 44px,44px 44px;
  }
  .box{text-align:center;max-width:520px;}
  .moon{
    width:76px;height:76px;margin:0 auto 26px;border-radius:50%;
    background:radial-gradient(circle at 65% 50%, #4dd8d0 0 44%, #1b2347 45% 100%);
    box-shadow:0 0 34px rgba(77,216,208,0.35), inset 0 0 20px rgba(0,0,0,0.4);
  }
  .no{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.3em;color:#4dd8d0;text-transform:uppercase;}
  h1{font-size:clamp(28px,6vw,40px);font-weight:700;margin:14px 0 10px;line-height:1.3;font-family:'Space Grotesk','Noto Sans SC',sans-serif;}
  p{color:#9aa3c7;font-size:14.5px;line-height:1.9;}
  a{
    display:inline-block;margin-top:28px;color:#0d1226;background:#4dd8d0;border-radius:5px;
    padding:12px 26px;font-size:14px;font-weight:500;text-decoration:none;font-family:'JetBrains Mono',monospace;
    transition:background .25s ease,box-shadow .25s ease;
  }
  a:hover{background:#7ce4de;box-shadow:0 0 22px rgba(77,216,208,0.4);}
</style>
</head>
<body>
  <div class="box">
    <div class="moon"></div>
    <div class="no">404 · Not Found</div>
    <h1>这条路径不在档案里</h1>
    <p>你访问的地址不存在：它可能被删除、写错了编号，或者从未被归档。回到首页，从最新的条目开始看起。</p>
    <a href="./">返回靛蓝档案</a>
  </div>
</body>
</html>
